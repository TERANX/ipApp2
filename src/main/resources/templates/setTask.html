<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script>
        $(document).ready(function () {
            var maxField = 11; //Input fields increment limitation
            var addButton = $('.add_button'); //Add button selector
            var wrapper = $('.field_wrapper'); //Input field wrapper
            var fieldHTML = '<div><input type="text" name="field_name[]" value="" th:field="*{option}"/><input type="checkbox" name="field_name[]" th:field="*{corOptions}"/><br><button class="remove_button btn btn-danger">Delete</button></div>'; //New input field html
            // var buttHTML = '<div><button class="add_button" title="Add field">Add</button><button class="remove_button">Delete</button></div>';
            var x = 1; //Initial field counter is 1

            // Once add button is clicked
            $(addButton).click(function () {
                //Check maximum number of input fields
                if (x < maxField) {
                    x++; //Increase field counter
                    $(wrapper).append(fieldHTML); //Add field html
                    $(wrapper).append(buttHTML);
                } else {
                    alert('A maximum of ' + maxField + ' fields are allowed to be added. ');
                }
            });

            // Once remove button is clicked
            $(wrapper).on('click', '.remove_button', function (e) {
                e.preventDefault();
                $(this).parent('div').remove(); //Remove field html
                x--; //Decrease field counter
            });
        });
    </script>

</head>


<body>

<form th:action="@{/setTask}" method="post" th:object="${tasks}">

    <div id="task-container">
        <div class="form-group">
            <label for="task-title">Task Title</label>
            <input aria-describedby="textHelp" class="form-control" id="task-title"
                   type="text" th:field="*{title}">
        </div>

        <div class="form-group">
            <label for="task-description">Description</label>
            <textarea aria-describedby="textHelp" class="form-control" id="task-description"
                      th:field="*{description}"></textarea>

        </div>
        <br>
        <div class="form-group">
            <label for="task-difficulty">Difficulty:</label>
            <select name="difficulty" id="task-difficulty" required>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>

        </div>

        <br>

        <div class="field_wrapper">
            <div>
                <!--            <input type="text" name="field_name[]" value=""/><br>-->
                <button type="button" class="add_button btn btn-secondary" title="Add field">Add an answer option
                </button>
            </div>
        </div>
        <br>
        <div>
            <button class="btn btn-success" id="setTask-btn">Сохранить задачу</button>
        </div>
</form>
</body>
</html>
